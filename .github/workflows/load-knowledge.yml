name: Load Knowledge Base
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/load_knowledge.py
      - database/rag_store/*.json
      - .github/workflows/load-knowledge.yml
permissions:
  contents: read
jobs:
  load:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "psycopg[binary]==3.2.*"
      - run: python scripts/load_knowledge.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
