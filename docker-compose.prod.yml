# Production stack for an NVIDIA GPU host with Caddy-managed HTTPS.
# Usage: docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  postgres:
    restart: always
    ports: []  # don't expose DB port publicly
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }

  redis:
    restart: always
    ports: []  # don't expose Redis port publicly
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.gpu
    restart: always
    env_file: .env.prod
    volumes: !override
      - avatar_cache:/tmp/avatars
      - video_cache:/tmp/videos
      - audio_cache:/tmp/audio
      - voice_profiles:/app/voice_profiles
      - model_cache:/root/.cache
      - ./database/rag_store:/app/database/rag_store
      - uploads_data:/app/backend/uploads
      - ./backend/models:/app/backend/models  # populate with scripts/setup_musetalk.sh on the GPU host
    environment:
      - MEDICARE_RAG_STORE=/app/database/rag_store
      - MUSETALK_PATH=/app/backend/models/MuseTalk
      # Each Uvicorn process creates its own resident GPU model worker.
      - UVICORN_WORKERS=1
    healthcheck:
      start_period: 240s  # allow one cold CUDA model load before readiness checks
    depends_on:
      ollama:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging:
      driver: json-file
      options: { max-size: "100m", max-file: "5" }

  frontend:
    restart: always
    env_file: .env.prod
    volumes: !override
      - /app/node_modules
      - /app/.next
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }

  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.gpu
    restart: always
    command: celery -A app.celery_app worker --loglevel=info --concurrency=1
    env_file: .env.prod
    volumes: !override
      - avatar_cache:/tmp/avatars
      - video_cache:/tmp/videos
      - audio_cache:/tmp/audio
      - voice_profiles:/app/voice_profiles
      - model_cache:/root/.cache
      - ./database/rag_store:/app/database/rag_store
      - uploads_data:/app/backend/uploads
      - ./backend/models:/app/backend/models
    environment:
      - MEDICARE_RAG_STORE=/app/database/rag_store
      - MUSETALK_PATH=/app/backend/models/MuseTalk
    depends_on:
      ollama:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ollama:
    image: ollama/ollama:latest
    restart: always
    volumes:
      - ollama_data:/root/.ollama
    expose:
      - "11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: always
    environment:
      - DOMAIN=${DOMAIN:?Set DOMAIN to the public hostname}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - avatar-network

  nginx:
    profiles: ["local-only"]
    restart: always
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }

  flower:
    # Disable Flower in production (security risk)
    profiles: ["dev"]

volumes:
  uploads_data:
    driver: local
  model_cache:
    driver: local
  ollama_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
